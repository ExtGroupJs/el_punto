# Docker Compose for production with Nginx + Gunicorn + Celery

services:
  postgres:
    container_name: ${WEBSITE_SLUG_NAME}_postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_REMOTE_NAME:-app_db}
      POSTGRES_USER: ${DB_REMOTE_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_REMOTE_PASSWORD:-postgres}
    ports:
      - "${DB_REMOTE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_REMOTE_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    container_name: ${WEBSITE_SLUG_NAME}_redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  web:
    container_name: ${WEBSITE_SLUG_NAME}_web
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - static_volume:/app/static_output
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=project_site.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - SESSION_EXPIRE_SECONDS=${SESSION_EXPIRE_SECONDS:-600}
      - DB_REMOTE_ENGINE=django.db.backends.postgresql
      - DB_REMOTE_NAME=${DB_REMOTE_NAME:-app_db}
      - DB_REMOTE_USER=${DB_REMOTE_USER:-postgres}
      - DB_REMOTE_PASSWORD=${DB_REMOTE_PASSWORD:-postgres}
      - DB_REMOTE_HOST=postgres
      - DB_REMOTE_PORT=5432
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE:-0.2}
      - CACHE_DEFAULT_TIMEOUT=${CACHE_DEFAULT_TIMEOUT:-3600}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - RUNNING_FROM=remote
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - "8000"

  nginx:
    container_name: ${WEBSITE_SLUG_NAME}_nginx
    build:
      context: .
      dockerfile: Dockerfile.nginx
    environment:
      - NGINX_ENABLE_SSL=${NGINX_ENABLE_SSL:-false}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
      - NGINX_SSL_CERT_PATH=${NGINX_SSL_CERT_PATH}
      - NGINX_SSL_KEY_PATH=${NGINX_SSL_KEY_PATH}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - static_volume:/app/static_output:ro
      - ./media:/app/media:ro
      - ${SSL_CERTS_HOST_PATH:-/etc/ssl/certs}:/etc/ssl/certs:ro
      - ${SSL_KEYS_HOST_PATH:-/etc/ssl/private}:/etc/ssl/private:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge
